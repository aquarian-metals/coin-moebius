# Docker compose bundle for self-hosted Bitcoin with Coin Moebius.
#
# Disclaimer: this file is a starting point, not a maintained artifact.
# `bitcoin/bitcoin` is a community image, not published by the Bitcoin Core
# project. It packages the release binaries from bitcoincore.org. Pin the
# tag you have checked, and move it forward yourself when Bitcoin Core ships
# a release or a security fix. Coin Moebius does not publish or maintain a
# turnkey image.
#
# Before first boot:
#   1. Fill in the .env values referenced below.
#   2. docker compose up -d bitcoind
#   3. Wait for the node to sync: docker compose exec bitcoind bitcoin-cli
#      -rpcuser=... -rpcpassword=... getblockchaininfo
#   4. Create the watch-only wallet and import your public key, as in
#      docs/self-hosted-bitcoin.md.
#   5. docker compose up -d indexer
#   6. Watch logs: docker compose logs -f indexer
#
# With -prune the node keeps only the newest block files, but the first
# sync still downloads and checks the whole chain. Plan accordingly.

services:
  bitcoind:
    image: bitcoin/bitcoin:31.1
    container_name: bitcoind
    restart: unless-stopped
    volumes:
      - ./bitcoin-data:/home/bitcoin/.bitcoin
    ports:
      - "8333:8333" # P2P
    command:
      - -server=1
      - -prune=550
      - -rpcbind=0.0.0.0
      - -rpcallowip=172.16.0.0/12
      - -rpcuser=${BITCOIN_RPC_USER:?BITCOIN_RPC_USER must be set in .env}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:?BITCOIN_RPC_PASSWORD must be set in .env}

  indexer:
    image: node:lts-alpine
    container_name: bitcoin-indexer
    restart: unless-stopped
    depends_on:
      - bitcoind
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install --no-save @aquarian-metals/coin-moebius-bitcoin @aquarian-metals/coin-moebius-server && node indexer.js"
    environment:
      BITCOIN_RPC_URL: http://bitcoind:8332
      BITCOIN_WALLET: shop
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:?BITCOIN_RPC_USER must be set in .env}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD:?BITCOIN_RPC_PASSWORD must be set in .env}
      BITCOIN_WEBHOOK_URL: ${BITCOIN_WEBHOOK_URL:?BITCOIN_WEBHOOK_URL must be set in .env}
      BITCOIN_HMAC_SECRET: ${BITCOIN_HMAC_SECRET:?BITCOIN_HMAC_SECRET must be set in .env}
      BITCOIN_REQUIRED_CONFIRMATIONS: 1
      BITCOIN_POLL_INTERVAL_MS: 30000
